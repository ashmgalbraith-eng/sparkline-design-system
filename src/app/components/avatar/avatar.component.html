<div class="sp-avatar" [ngClass]="['sp-avatar--' + size, 'sp-avatar--' + type]">
  <!-- Text initials -->
  <span *ngIf="type === 'text'" class="sp-avatar__initials">{{ displayInitials }}</span>

  <!-- Image -->
  <img
    *ngIf="type === 'image'"
    class="sp-avatar__image"
    [src]="imageSrc"
    [alt]="imageAlt"
  />

  <!-- Icon (account-outline) -->
  <sp-icon
    *ngIf="type === 'icon'"
    class="sp-avatar__icon"
    name="account-outline"
    [size]="iconSize"
    color="currentColor"
  ></sp-icon>

  <!-- Status dot (dot Badge variant) -->
  <span *ngIf="showStatus" class="sp-avatar__status-anchor">
    <sp-badge type="dot" [status]="statusColor"></sp-badge>
  </span>

  <!-- Numeric notification (numeric Badge variant, left-locked, grows right) -->
  <span *ngIf="showNotification" class="sp-avatar__notification-anchor">
    <sp-badge type="numeric" status="notification" [label]="displayNotificationCount"></sp-badge>
  </span>
</div>
