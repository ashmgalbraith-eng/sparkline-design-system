<!-- Label -->
<label *ngIf="label" class="sp-input__label">{{ label }}<span *ngIf="showOptional" class="sp-input__label-optional">(optional)</span></label>

<!-- Field container -->
<div [ngClass]="['sp-input', 'sp-input--' + fieldState]">
  <!-- Left icon -->
  <sp-icon
    *ngIf="showLeftIcon && leftIconName"
    class="sp-input__icon"
    [name]="leftIconName"
    [size]="20"
    color="currentColor"
  ></sp-icon>

  <!-- Input -->
  <input
    class="sp-input__field"
    [type]="type"
    [placeholder]="placeholder"
    [value]="value"
    [disabled]="state === 'disabled'"
    (input)="onInput($event)"
    (focus)="onFocus()"
    (blur)="onBlur()"
  />

  <!-- Right icon -->
  <sp-icon
    *ngIf="showRightIcon && rightIconName"
    class="sp-input__icon"
    [name]="rightIconName"
    [size]="20"
    color="currentColor"
  ></sp-icon>

  <!-- Error icon (shown in error state when no right icon) -->
  <sp-icon
    *ngIf="fieldState === 'error' && !(showRightIcon && rightIconName)"
    class="sp-input__icon sp-input__icon--error"
    name="alert-circle-outline"
    [size]="20"
    color="currentColor"
  ></sp-icon>
</div>

<!-- Helper / Error / Success text -->
<span
  *ngIf="fieldState === 'error' && errorText"
  class="sp-input__helper sp-input__helper--error"
>
  {{ errorText }}
</span>
<span
  *ngIf="fieldState === 'success' && helperText"
  class="sp-input__helper sp-input__helper--success"
>
  {{ helperText }}
</span>
<span
  *ngIf="fieldState !== 'error' && fieldState !== 'success' && helperText"
  class="sp-input__helper"
>
  {{ helperText }}
</span>
