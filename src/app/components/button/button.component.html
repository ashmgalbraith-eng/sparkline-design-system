<ng-container *ngIf="showLeftIcon">
  <span class="sp-button__icon sp-button__icon--left">
    <sp-icon [name]="leftIconName" [size]="24" color="currentColor"></sp-icon>
  </span>
</ng-container>

<span *ngIf="showText" class="sp-button__label">{{ label }}</span>

<ng-container *ngIf="showRightIcon">
  <span class="sp-button__icon sp-button__icon--right">
    <sp-icon [name]="rightIconName" [size]="24" color="currentColor"></sp-icon>
  </span>
</ng-container>
