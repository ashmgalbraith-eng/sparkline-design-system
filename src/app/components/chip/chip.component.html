<!-- Left icon -->
<svg
  *ngIf="showLeftIcon"
  class="sp-chip__icon"
  width="18"
  height="18"
  viewBox="0 0 24 24"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
>
  <path
    d="M12 2C6.48 2 2 6.48 2 12C2 17.52 6.48 22 12 22C17.52 22 22 17.52 22 12C22 6.48 17.52 2 12 2ZM12 20C7.58 20 4 16.42 4 12C4 7.58 7.58 4 12 4C16.42 4 20 7.58 20 12C20 16.42 16.42 20 12 20Z"
    fill="currentColor"
  />
</svg>

<!-- Label -->
<span class="sp-chip__label">{{ label }}</span>

<!-- Right icon (generic) for plain type -->
<svg
  *ngIf="type === 'plain' && showRightIcon"
  class="sp-chip__icon"
  width="18"
  height="18"
  viewBox="0 0 24 24"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
>
  <path
    d="M7 10L12 15L17 10H7Z"
    fill="currentColor"
  />
</svg>

<!-- Close icon for clearable type -->
<svg
  *ngIf="type === 'clearable'"
  class="sp-chip__close"
  width="18"
  height="18"
  viewBox="0 0 24 24"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
  (click)="onRemove($event)"
>
  <path
    d="M19 6.41L17.59 5L12 10.59L6.41 5L5 6.41L10.59 12L5 17.59L6.41 19L12 13.41L17.59 19L19 17.59L13.41 12L19 6.41Z"
    fill="currentColor"
  />
</svg>
