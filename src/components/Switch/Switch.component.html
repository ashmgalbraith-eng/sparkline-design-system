<label [class]="classes" data-component="switch">
  <input
    type="checkbox"
    class="sparkline-switch__input"
    [checked]="checked"
    [disabled]="disabled"
    (change)="onChange($event)"
  />
  <span class="sparkline-switch__slider">
    <span class="sparkline-switch__thumb"></span>
  </span>
  <span *ngIf="label" class="sparkline-switch__label">{{ label }}</span>
</label>
