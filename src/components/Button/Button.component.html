<button
  type="button"
  [class]="classes"
  [disabled]="disabled"
  (click)="onClick()"
  data-component="button"
>
  <span *ngIf="showLeftIcon" class="sparkline-button__icon sparkline-button__icon--left">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M15 18L9 12L15 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </span>
  <span class="sparkline-button__label">{{ label }}</span>
  <span *ngIf="showRightIcon" class="sparkline-button__icon sparkline-button__icon--right">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M9 18L15 12L9 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </span>
</button>
