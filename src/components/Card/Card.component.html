<div [class]="classes" (click)="onClick()" data-component="card">
  <div *ngIf="imageSrc" class="sparkline-card__image">
    <img [src]="imageSrc" [alt]="imageAlt" />
  </div>
  <div class="sparkline-card__content">
    <h3 *ngIf="title" class="sparkline-card__title">{{ title }}</h3>
    <div class="sparkline-card__body">{{ bodyText }}</div>
  </div>
  <div class="sparkline-card__footer">
    <ng-content select="[footer]"></ng-content>
  </div>
</div>
