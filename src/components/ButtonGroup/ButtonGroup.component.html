<div [class]="classes" data-component="button-group">
  <button
    *ngFor="let button of buttons"
    class="sparkline-button-group__button"
    [class.sparkline-button-group__button--selected]="button.selected"
    [disabled]="disabled"
  >
    <span *ngIf="showLeftIcons" class="sparkline-button-group__icon">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M15 18L9 12L15 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </span>
    <span *ngIf="button.label" class="sparkline-button-group__label">{{ button.label }}</span>
    <span *ngIf="showRightIcons" class="sparkline-button-group__icon">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M9 18L15 12L9 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </span>
  </button>
</div>
