<div class="sparkline-input-wrapper" data-component="input">
  <div *ngIf="label" class="sparkline-input__label-row">
    <label class="sparkline-input__label">{{ label }}</label>
    <span *ngIf="optional" class="sparkline-input__optional">(optional)</span>
  </div>
  <div class="sparkline-input__input-wrapper sparkline-input__input-wrapper--{{ state }}">
    <span *ngIf="showIconLeft" class="sparkline-input__icon sparkline-input__icon--left">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M18 6L6 18M6 6l12 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </span>
    <input
      [type]="type"
      [class]="inputClasses"
      [placeholder]="placeholder || ''"
      [value]="value || ''"
      [disabled]="isDisabled"
      (input)="onInput($event)"
    />
    <span *ngIf="showIconRight" class="sparkline-input__icon sparkline-input__icon--right">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M18 6L6 18M6 6l12 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </span>
  </div>
  <div *ngIf="showError" class="sparkline-input__message-row">
    <span class="sparkline-input__message sparkline-input__message--error">{{ errorMessage }}</span>
  </div>
  <div *ngIf="showHelper" class="sparkline-input__message-row">
    <span class="sparkline-input__message sparkline-input__message--helper">{{ helperText }}</span>
  </div>
</div>
